function renderFilters(){const opts={film:filmList(),date:DATES,cinema:uniq(rowsAll,'cinema')};const L={film:'Film',date:'Date',cinema:'Theatre'};

function aggTable(rs,k,label,keys,fmt){const g=group(rs,k);keys=keys||Object.keys(g).sort();keys=keys.filter(x=>g[x]);if(!keys.length)return '<div class="empty">No data yet</div>';

 keys.map(x=>{const a=agg(g[x]);return `<tr><td>${fmt?fmt(x):x}</td><td class="n">${a.shows}</td><td class="n">${num(a.seats)}</td><td class="n">${num(a.sold)}</td><td class="n">${pct(a.sold,a.seats)}</td><td class="n">${inr(a.gross)}</td></tr>`}).join('')+
 `<tr class="tot"><td>Total</td><td class="n">${t.shows}</td><td class="n">${num(t.seats)}</td><td class="n">${num(t.sold)}</td><td class="n">${pct(t.sold,t.seats)}</td><td class="n">${inr(t.gross)}</td></tr></table></div>`}
const ff=f=>`<span class="dot" style="background:${COL[f]||'#888'}"></span>${f}`;

function vShow(rs){const fl=filmList();if(fs.film)subFilm=fs.film;if(!fl.includes(subFilm))subFilm=fl[0];const x=rs.filter(r=>r.film==subFilm);

function vTheatre(rs){const cl=uniq(rowsAll,'cinema');if(fs.cinema)subCin=fs.cinema;if(!cl.includes(subCin))subCin=cl[0];if(!subCin)return '<div class="empty">No data yet</div>';const x=rs.filter(r=>r.cinema==subCin);

function render(){renderFilters();tabs();const rs=R();const v=document.getElementById('view');
